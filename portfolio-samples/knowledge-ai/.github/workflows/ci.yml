# Paths are relative to the project root: this file moves with the project
# when it becomes its own repository.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit/API tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (no model download, no API key)
        run: pytest -m "not slow"

  eval:
    name: ingest + evaluation (real embedding model)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: models
          # the model is pinned to a commit in config.py → cache key follows the file
          key: e5-${{ hashFiles('src/knowledge_ai/config.py') }}
      - run: kai download-model
      - run: kai ingest
      - name: Slow tests (real model)
        run: pytest -m slow
      - name: Evaluate
        env:
          # Optional repository secret; without it the Claude section is reported as skipped.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/eval.py --out eval-out
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-out/
