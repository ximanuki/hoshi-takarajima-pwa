<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="小学1〜2年生向け。5つの しまを ぼうけんしながら さんすう・こくご・くらし・ひらめき・しぜんを まなぶ ゲーム。" />
    <meta name="theme-color" content="#56c7b4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1630" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="たからじま" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
    />
    <title>ほしのたからじま</title>
    <script>
      // テーマと もじサイズを さきに あてて ちらつきを ふせぐ
      try {
        var saved = JSON.parse(localStorage.getItem('hoshi-takarajima-pwa') || 'null');
        var s = saved && saved.state && saved.state.settings;
        if (s && (s.theme === 'light' || s.theme === 'dark')) document.documentElement.dataset.theme = s.theme;
        if (s && s.largeText) document.documentElement.dataset.text = 'large';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
